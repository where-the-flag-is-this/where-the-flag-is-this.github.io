name: Quality Control

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master

jobs:
  quality-check:
    runs-on: ubuntu-latest
    name: Run unit tests
    steps:
    - uses: actions/checkout@v3
    - name: Install Dependencies
      run: npm install
    - name: Run Vitest
      run: npx vitest run